version: '3.8'
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: alams404/paynaija-demo:latest
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: alams404/paynaija-frontend:latest
    ports:
      - "3000:5173"
    depends_on:
      - api